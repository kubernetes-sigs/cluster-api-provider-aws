name: List AMIs by kubernetes_version

on:
    workflow_dispatch:
        inputs:
            kubernetes_version:
                description: "Substring to match against the kubernetes_version tag (e.g. 1.28)"
                required: true
                type: string
            regions:
                description: "Comma-separated list of AWS regions (overrides default)"
                required: true
                type: string
                default: 'ap-south-1,eu-west-3,eu-west-2,eu-west-1,ap-northeast-2,ap-northeast-1,sa-east-1,ca-central-1,ap-southeast-1,ap-southeast-2,eu-central-1,us-east-1,us-east-2,us-west-1,us-west-2'

permissions:
    id-token: write
    contents: read

jobs:
    list-amis:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./hack/tools/ami
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up uv
              uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

            - name: Install dependencies
              run: uv sync --frozen

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                aws-region: us-east-2
                role-to-assume: arn:aws:iam::819546954734:role/gh-image-builder

            - name: Run list-amis
              env:
                  REGIONS: ${{ inputs.regions }}
                  K8S_VERSION: ${{ inputs.kubernetes_version }}
              run: |
                  uv run python3 list_amis.py \
                    --regions "$REGIONS" \
                    --version-contains "$K8S_VERSION"
