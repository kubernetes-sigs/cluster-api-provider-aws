name: List AMIs by kubernetes_version

on:
    workflow_dispatch:
        inputs:
            kubernetes_version:
                description: "Substring to match against the kubernetes_version tag (e.g. 1.28)"
                required: true
                type: string
            regions:
                description: "Comma-separated list of AWS regions (overrides default)"
                required: true
                type: string
                default: 'ap-south-1,eu-west-3,eu-west-2,eu-west-1,ap-northeast-2,ap-northeast-1,sa-east-1,ca-central-1,ap-southeast-1,ap-southeast-2,eu-central-1,us-east-1,us-east-2,us-west-1,us-west-2'

permissions:
    id-token: write
    contents: read

jobs:
    list-amis:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./hack/tools/ami
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

            - name: Install dependencies
              run: uv sync --frozen

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
              with:
                aws-region: us-east-2
                role-to-assume: arn:aws:iam::819546954734:role/gh-image-builder

            - name: Run list-amis
              env:
                  REGIONS: ${{ inputs.regions }}
                  K8S_VERSION: ${{ inputs.kubernetes_version }}
              run: |
                  uv run python3 list_amis.py \
                    --regions "$REGIONS" \
                    --version-contains "$K8S_VERSION"
