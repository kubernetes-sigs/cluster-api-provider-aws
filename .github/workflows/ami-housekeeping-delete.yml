name: Delete AMIs by kubernetes_version

on:
    workflow_dispatch:
        inputs:
            kubernetes_version:
                description: "Substring to match against the kubernetes_version tag (e.g. 1.28)"
                required: true
                type: string
            execute:
                description: "Apply deletions? (leave unchecked for dry-run preview)"
                required: true
                type: boolean
                default: false
            regions:
                description: "Comma-separated list of AWS regions (overrides default)"
                required: false
                type: string
                default: 'ap-south-1,eu-west-3,eu-west-2,eu-west-1,ap-northeast-2,ap-northeast-1,sa-east-1,ca-central-1,ap-southeast-1,ap-southeast-2,eu-central-1,us-east-1,us-east-2,us-west-1,us-west-2'

permissions:
    id-token: write
    contents: read

jobs:
    delete-amis:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./hack/tools/ami
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

            - name: Install dependencies
              run: uv sync --frozen

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                aws-region: us-east-2
                role-to-assume: arn:aws:iam::819546954734:role/gh-image-builder

            - name: Run delete-amis
              env:
                  REGIONS: ${{ inputs.regions }}
                  K8S_VERSION: ${{ inputs.kubernetes_version }}
              run: |
                  EXECUTE_FLAG=""
                  if [ "${{ inputs.execute }}" = "true" ]; then
                    EXECUTE_FLAG="--execute"
                  fi
                  uv run python3 delete_amis.py \
                    --regions "$REGIONS" \
                    --version-contains "$K8S_VERSION" \
                    $EXECUTE_FLAG
