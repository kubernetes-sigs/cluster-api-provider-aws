name: release

on:
  push:
    tags:
    - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release (defaults to the triggering ref when omitted)'
        required: false
        type: string

permissions:
  contents: write # required to write to github release.

jobs:
  release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Build release-tool
        working-directory: hack/tools/release-tools
        run: go build -o ../../../bin/release-tool .
      - name: Set version info
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          echo "VERSION=${version}" >> $GITHUB_ENV
          echo "PREVIOUS_VERSION=$(git tag -l 'v*' | ./bin/release-tool changelog previous-version --version "${version}")" >> $GITHUB_ENV
          echo "RELEASE_BRANCH=release-$(echo ${version} | grep -Eo '[0-9]\.[0-9]+')" >> $GITHUB_ENV
          echo "RELEASE_TAG=${version}" >> $GITHUB_ENV
      - name: Run release
        run: |
          echo "Version is: $VERSION"
          echo "Previous version is: $PREVIOUS_VERSION"
          echo "Release branch is: $RELEASE_BRANCH"
          echo "Release tag is: $RELEASE_TAG"
          make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
