apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
  topology:
    classRef:
      name: eks-mp-e2e
    version: ${KUBERNETES_VERSION}
    workers:
      machinePools:
      - class: default-pool
        name: mp-0
        replicas: ${WORKER_MACHINE_COUNT}
